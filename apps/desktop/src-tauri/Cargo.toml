[package]
name = "cool-pi-desktop"
version = "0.1.0"
edition = "2024"
[lib]
name = "cool_pi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[dependencies]
host-core = { path = "../../../crates/host-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[build-dependencies]
tauri-build = { version = "2" }
